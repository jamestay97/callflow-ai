<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kids Cartoon Show</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1280px; height: 720px; overflow: hidden; background: #87CEEB; }
    #c { display: block; width: 1280px; height: 720px; }
    #caption {
      position: absolute; left: 48px; right: 48px; bottom: 32px;
      padding: 18px 28px; border-radius: 22px;
      background: rgba(255,255,255,0.94);
      color: #1a1a2e;
      font-family: "Fredoka", "Segoe UI", sans-serif;
      font-size: 30px; font-weight: 700; line-height: 1.35;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0,0,0,0.16);
      max-height: 150px; overflow: hidden;
      opacity: 0; transform: translateY(24px) scale(0.96);
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    #caption.show {
      opacity: 1; transform: translateY(0) scale(1);
    }
    #emoji {
      position: absolute; top: 22px; right: 34px; font-size: 58px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.22));
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="emoji"></div>
  <div id="caption"></div>
  <script type="module">
    import * as THREE from "three";
    import { createCartoonAnimal } from "/assets/3d/characters.js";

    const params = new URLSearchParams(location.search);
    const characterId = params.get("character") || "buddy";
    const mood = params.get("mood") || "story";
    const bgColor = params.get("bg") || "#4D96FF";
    const emoji = params.get("emoji") || "⭐";
    const text = params.get("text") || "";
    const greenscreen = params.get("greenscreen") === "1";
    const talkingCloseup = params.get("talking") === "1";
    const showMode = params.get("show") === "1" || (!greenscreen && !talkingCloseup);
    const propsRaw = params.get("props") || "";

    const captionEl = document.getElementById("caption");
    const emojiEl = document.getElementById("emoji");
    if (greenscreen) {
      captionEl.style.display = "none";
      emojiEl.style.display = "none";
    } else {
      emojiEl.textContent = emoji;
      captionEl.textContent = text;
      requestAnimationFrame(() => captionEl.classList.add("show"));
    }

    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1280, 720, false);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    if (greenscreen) {
      scene.background = new THREE.Color(0x00ff00);
      scene.fog = null;
    } else {
      const base = new THREE.Color(bgColor);
      scene.background = base.clone().lerp(new THREE.Color("#5ec8ff"), 0.55);
      scene.fog = new THREE.Fog(base.clone().lerp(new THREE.Color("#a8e0ff"), 0.35), 18, 40);
    }

    const camera = new THREE.PerspectiveCamera(38, 1280 / 720, 0.1, 100);
    if (talkingCloseup) {
      camera.position.set(0, 1.85, 5.8);
      camera.lookAt(0, 1.45, 0);
    } else if (showMode) {
      camera.position.set(0, 2.4, 8.2);
      camera.lookAt(0, 1.35, 0);
    } else {
      camera.position.set(0, 2.2, 7.2);
      camera.lookAt(0, 1.4, 0);
    }

    scene.add(new THREE.HemisphereLight(0xfff8ee, 0x6aaa58, 1.05));
    const sun = new THREE.DirectionalLight(0xffffff, 1.65);
    sun.position.set(5, 11, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const fill = new THREE.DirectionalLight(0xffd6e8, 0.5);
    fill.position.set(-5, 3, 3);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xa0d8ff, 0.35);
    rim.position.set(0, 2, -6);
    scene.add(rim);

    const worldAnim = [];
    const propMeshes = [];

    function mat(color, opts = {}) {
      return new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.02, ...opts });
    }
    function mesh(geo, color, opts = {}) {
      const m = new THREE.Mesh(geo, mat(color, opts));
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }

    let clouds = [];
    if (!greenscreen) {
      const ground = mesh(new THREE.CircleGeometry(16, 72), 0x7ec850, { roughness: 0.9 });
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      ground.castShadow = false;
      scene.add(ground);

      const path = mesh(new THREE.PlaneGeometry(2.4, 10), 0xf0d9a8, { roughness: 1 });
      path.rotation.x = -Math.PI / 2;
      path.position.set(0, 0.03, 2);
      path.castShadow = false;
      scene.add(path);

      const hillMat = mat(new THREE.Color(bgColor).offsetHSL(0.05, -0.15, 0.12).getHex(), { roughness: 1 });
      for (const [x, z, s] of [[-7, -7, 2.4], [6.5, -8, 3.0], [1, -11, 3.8], [-4, -10, 2.2]]) {
        const hill = new THREE.Mesh(new THREE.SphereGeometry(s, 18, 12), hillMat);
        hill.position.set(x, s * 0.32, z);
        hill.scale.y = 0.5;
        scene.add(hill);
      }

      // Cartoon trees
      for (const [x, z, h, leaf] of [
        [-4.2, -2.5, 1.1, 0x4caf50],
        [4.6, -3.2, 1.3, 0x66bb6a],
        [-5.5, -5, 0.9, 0x43a047],
        [5.8, -5.5, 1.0, 0x81c784],
      ]) {
        const tree = new THREE.Group();
        const trunk = mesh(new THREE.CylinderGeometry(0.12, 0.18, h, 8), 0x8d6e63);
        trunk.position.y = h / 2;
        tree.add(trunk);
        const canopy = mesh(new THREE.SphereGeometry(0.7, 16, 12), leaf);
        canopy.position.y = h + 0.35;
        canopy.scale.set(1.1, 0.95, 1.1);
        tree.add(canopy);
        tree.position.set(x, 0, z);
        scene.add(tree);
        worldAnim.push({ type: "sway", obj: tree, amp: 0.03, speed: 1.2 + Math.random() });
      }

      // Flowers
      const flowerColors = [0xff6b9d, 0xffe066, 0xff9f69, 0xc490e4, 0x4d96ff];
      for (let i = 0; i < 14; i++) {
        const f = new THREE.Group();
        const stem = mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.35, 6), 0x4caf50);
        stem.position.y = 0.18;
        f.add(stem);
        const petal = mesh(new THREE.SphereGeometry(0.14, 10, 8), flowerColors[i % flowerColors.length]);
        petal.position.y = 0.4;
        petal.scale.set(1, 0.55, 1);
        f.add(petal);
        f.position.set((Math.random() - 0.5) * 9, 0, (Math.random() - 0.5) * 6 + 1);
        scene.add(f);
        worldAnim.push({ type: "bob", obj: f, amp: 0.04, speed: 2 + Math.random(), phase: Math.random() * 6 });
      }

      // Butterflies
      for (let i = 0; i < 5; i++) {
        const b = new THREE.Group();
        const body = mesh(new THREE.CapsuleGeometry(0.03, 0.12, 4, 6), 0x333333);
        b.add(body);
        const wingL = mesh(new THREE.SphereGeometry(0.1, 10, 8), flowerColors[i % flowerColors.length], { roughness: 0.35 });
        wingL.scale.set(1.4, 0.15, 0.9);
        wingL.position.set(-0.1, 0, 0);
        b.add(wingL);
        const wingR = wingL.clone();
        wingR.position.x = 0.1;
        b.add(wingR);
        b.position.set((Math.random() - 0.5) * 6, 1.5 + Math.random(), (Math.random() - 0.5) * 4);
        scene.add(b);
        worldAnim.push({
          type: "fly",
          obj: b,
          wingL,
          wingR,
          home: b.position.clone(),
          speed: 1.5 + Math.random(),
          radius: 0.6 + Math.random() * 0.8,
        });
      }

      const cloudMat = mat(0xffffff, { roughness: 1 });
      function makeCloud(x, y, z, scale = 1) {
        const g = new THREE.Group();
        for (const [ox, oy, s] of [[0, 0, 0.55], [0.5, 0.1, 0.4], [-0.45, 0.05, 0.38], [0.15, 0.25, 0.32]]) {
          const m = new THREE.Mesh(new THREE.SphereGeometry(s, 12, 10), cloudMat);
          m.position.set(ox, oy, 0);
          g.add(m);
        }
        g.position.set(x, y, z);
        g.scale.setScalar(scale);
        scene.add(g);
        return g;
      }
      clouds = [makeCloud(-4.5, 4.4, -5, 1.25), makeCloud(3.8, 5.0, -6, 1.05), makeCloud(0.2, 5.4, -8, 1.45)];
    }

    // Lesson props (numbers / colors / stars)
    function makeNumberProp(n, index, total) {
      const g = new THREE.Group();
      const canvas2 = document.createElement("canvas");
      canvas2.width = 256;
      canvas2.height = 256;
      const ctx = canvas2.getContext("2d");
      ctx.clearRect(0, 0, 256, 256);
      ctx.beginPath();
      ctx.arc(128, 128, 110, 0, Math.PI * 2);
      const colors = ["#FF6B9D", "#4D96FF", "#6BCB77", "#FFE066", "#FF9F69", "#C490E4"];
      ctx.fillStyle = colors[index % colors.length];
      ctx.fill();
      ctx.fillStyle = "#1a1a2e";
      ctx.font = "bold 140px Fredoka, Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(n), 128, 140);
      const tex = new THREE.CanvasTexture(canvas2);
      const plate = new THREE.Mesh(
        new THREE.CircleGeometry(0.55, 32),
        new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.4 })
      );
      g.add(plate);
      const angle = (index / Math.max(total, 1)) * Math.PI - Math.PI / 2;
      g.position.set(Math.cos(angle) * 2.4, 2.2, Math.sin(angle) * 0.6 + 0.4);
      g.userData = { kind: "number", index, spin: 0.8 + index * 0.1 };
      scene.add(g);
      propMeshes.push(g);
      return g;
    }

    function makeColorProp(name, index, total) {
      const map = {
        red: 0xff4d4d, blue: 0x4d96ff, yellow: 0xffe066, green: 0x6bcb77,
        orange: 0xff9f69, purple: 0xc490e4, pink: 0xff6b9d,
      };
      const ball = mesh(new THREE.SphereGeometry(0.45, 24, 18), map[name] || 0xffe066);
      const angle = (index / Math.max(total, 1)) * Math.PI - Math.PI / 2;
      ball.position.set(Math.cos(angle) * 2.5, 2.0 + index * 0.05, Math.sin(angle) * 0.5);
      ball.userData = { kind: "color", index, spin: 1 };
      scene.add(ball);
      propMeshes.push(ball);
    }

    function makeStarProp(index, total) {
      const star = mesh(new THREE.OctahedronGeometry(0.35, 0), 0xffe066, { roughness: 0.25, metalness: 0.15 });
      const angle = (index / Math.max(total, 1)) * Math.PI * 2;
      star.position.set(Math.cos(angle) * 2.2, 2.4 + (index % 2) * 0.3, Math.sin(angle) * 1.2 - 0.5);
      star.userData = { kind: "star", index, spin: 1.4 };
      scene.add(star);
      propMeshes.push(star);
    }

    if (showMode && propsRaw) {
      const [kind, payload] = propsRaw.split(":");
      const items = (payload || "").split(",").filter(Boolean);
      if (kind === "numbers") items.forEach((n, i) => makeNumberProp(n, i, items.length));
      else if (kind === "colors") items.forEach((c, i) => makeColorProp(c, i, items.length));
      else if (kind === "stars") {
        const count = Number(items[0]) || 3;
        for (let i = 0; i < count; i++) makeStarProp(i, count);
      }
    }

    // Sparkles for celebrate / show
    const sparkles = [];
    if (showMode || mood === "celebrate") {
      for (let i = 0; i < 24; i++) {
        const s = mesh(new THREE.SphereGeometry(0.05, 8, 6), 0xffffff, { roughness: 0.2, metalness: 0.3, emissive: 0xfff3a0, emissiveIntensity: 0.4 });
        s.position.set((Math.random() - 0.5) * 6, 1 + Math.random() * 3, (Math.random() - 0.5) * 3);
        scene.add(s);
        sparkles.push({ mesh: s, phase: Math.random() * 10, speed: 2 + Math.random() * 2 });
      }
    }

    const {
      character,
      bodyGroup,
      head,
      armL,
      armR,
      legL,
      legR,
      eyeWhiteL,
      eyeWhiteR,
      pupilL,
      pupilR,
      blinkL,
      blinkR,
      setMouthOpen,
    } = createCartoonAnimal(THREE, characterId);
    scene.add(character);
    if (talkingCloseup) character.scale.setScalar(1.2);
    if (showMode) character.scale.setScalar(1.05);

    if (!greenscreen) {
      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(0.95, 28),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.16 })
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.02;
      character.add(shadow);
    }

    const confetti = new THREE.Group();
    scene.add(confetti);
    const confettiPieces = [];
    const confettiColors = [0xff6b9d, 0xffe066, 0x6bcb77, 0x4d96ff, 0xff9f69, 0xc490e4];
    for (let i = 0; i < 48; i++) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, 0.12, 0.02),
        new THREE.MeshStandardMaterial({ color: confettiColors[i % confettiColors.length], roughness: 0.45 })
      );
      m.position.set((Math.random() - 0.5) * 5, 2 + Math.random() * 3, (Math.random() - 0.5) * 2);
      confetti.add(m);
      confettiPieces.push({
        mesh: m,
        vx: (Math.random() - 0.5) * 0.025,
        vy: -0.012 - Math.random() * 0.02,
        spin: (Math.random() - 0.5) * 0.25,
      });
    }
    confetti.visible = false;

    if (talkingCloseup) {
      legL.visible = false;
      legR.visible = false;
      character.position.y = -0.15;
      confetti.visible = false;
    }

    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function animateAt(progress, mouthAmount) {
      const t = progress * Math.PI * 2;
      let bodyY = 0, bodyRotY = 0, bodyRotZ = 0, armWave = 0, scale = 1, blink = false;
      let camX = 0, camY = talkingCloseup ? 1.85 : showMode ? 2.4 : 2.2;
      let camZ = talkingCloseup ? 5.8 : showMode ? 8.2 : 7.2;
      let charX = 0;

      if (talkingCloseup) {
        bodyY = Math.sin(t * 1.2) * 0.03;
        bodyRotY = Math.sin(t * 0.8) * 0.05;
        armWave = -0.55 + Math.sin(t * 2.2) * 0.45;
        blink = progress > 0.01 && ((progress * 8) % 1) > 0.92;
        confetti.visible = false;
      } else {
        // Entrance: walk/hop in from left during first 18%
        if (showMode && progress < 0.18) {
          const p = easeOutBack(progress / 0.18);
          charX = -3.5 * (1 - p);
          bodyY = Math.abs(Math.sin(p * Math.PI * 2)) * 0.25;
          armWave = -0.8;
        }

        switch (mood) {
          case "intro":
            bodyY += Math.sin(t * 2) * 0.12;
            bodyRotZ = Math.sin(t) * 0.06;
            armWave = -0.95 + Math.sin(t * 3) * 0.95;
            scale = 1 + Math.sin(t * 2) * 0.03;
            camX = Math.sin(t * 0.5) * 0.4;
            camZ = (showMode ? 8.2 : 7.2) - progress * 0.6;
            blink = progress > 0.01 && ((progress * 10) % 1) > 0.92;
            confetti.visible = false;
            break;
          case "celebrate":
            bodyY += Math.abs(Math.sin(t * 3)) * 0.42;
            bodyRotY = Math.sin(t * 2) * 0.22;
            bodyRotZ = Math.sin(t * 2) * 0.1;
            armWave = -1.4 + Math.sin(t * 4) * 0.75;
            scale = 1 + Math.sin(t * 3) * 0.045;
            camY += Math.sin(t) * 0.12;
            confetti.visible = !greenscreen;
            for (const p of confettiPieces) {
              p.mesh.position.x += p.vx;
              p.mesh.position.y += p.vy;
              p.mesh.rotation.z += p.spin;
              if (p.mesh.position.y < 0.2) {
                p.mesh.position.y = 4 + Math.random();
                p.mesh.position.x = (Math.random() - 0.5) * 4;
              }
            }
            break;
          case "outro":
            bodyY += Math.sin(t * 1.5) * 0.08;
            armWave = -1.15 + Math.sin(t * 2) * 0.75;
            bodyRotZ = Math.sin(t) * 0.05;
            camX = Math.sin(t * 0.4) * 0.28;
            blink = progress > 0.01 && ((progress * 8) % 1) > 0.92;
            confetti.visible = false;
            break;
          case "lesson":
            bodyY += Math.sin(t) * 0.03;
            armWave = 0.15 + Math.sin(t * 1.5) * 0.25;
            bodyRotY = Math.sin(t * 0.5) * 0.1;
            // Point toward props
            if (propMeshes.length) head.rotation.y = Math.sin(t * 0.7) * 0.15;
            blink = progress > 0.01 && ((progress * 6) % 1) > 0.93;
            confetti.visible = false;
            break;
          default:
            bodyY += Math.sin(t * 1.2) * 0.08;
            bodyRotY = Math.sin(t * 1.5) * 0.12;
            armWave = Math.sin(t * 2) * 0.4;
            blink = progress > 0.01 && ((progress * 7) % 1) > 0.93;
            camX = Math.sin(t * 0.35) * 0.25;
            confetti.visible = false;
            break;
        }
      }

      const mouth = Number(mouthAmount) || 0;
      const chatter = mouth > 0.1 ? 0.08 * Math.sin(progress * 80) : 0;
      setMouthOpen(Math.min(1, mouth + Math.max(0, chatter)));

      character.position.x = charX;
      bodyGroup.position.y = bodyY;
      bodyGroup.rotation.y = bodyRotY;
      bodyGroup.rotation.z = bodyRotZ;
      bodyGroup.scale.setScalar(scale);

      armR.rotation.z = armWave;
      armL.rotation.z = -armWave * 0.45;
      armR.rotation.x = Math.sin(t * 2) * 0.15;
      armL.rotation.x = Math.sin(t * 2 + 1) * 0.1;

      // Walk cycle for legs in show mode
      if (showMode && !talkingCloseup && legL.visible) {
        legL.rotation.x = Math.sin(t * 4) * 0.35 * (progress < 0.18 ? 1 : 0.25);
        legR.rotation.x = Math.sin(t * 4 + Math.PI) * 0.35 * (progress < 0.18 ? 1 : 0.25);
      }

      pupilL.visible = !blink;
      pupilR.visible = !blink;
      eyeWhiteL.visible = !blink;
      eyeWhiteR.visible = !blink;
      blinkL.visible = blink;
      blinkR.visible = blink;

      for (let i = 0; i < clouds.length; i++) {
        clouds[i].position.x += 0.003 * (i % 2 === 0 ? 1 : -1);
        if (clouds[i].position.x > 8) clouds[i].position.x = -8;
        if (clouds[i].position.x < -8) clouds[i].position.x = 8;
      }

      const wt = progress * Math.PI * 2;
      for (const w of worldAnim) {
        if (w.type === "sway") w.obj.rotation.z = Math.sin(wt * w.speed) * w.amp;
        if (w.type === "bob") w.obj.position.y = Math.sin(wt * w.speed + w.phase) * w.amp;
        if (w.type === "fly") {
          w.obj.position.x = w.home.x + Math.cos(wt * w.speed) * w.radius;
          w.obj.position.y = w.home.y + Math.sin(wt * w.speed * 1.3) * 0.35;
          w.obj.position.z = w.home.z + Math.sin(wt * w.speed * 0.7) * w.radius * 0.4;
          w.wingL.rotation.z = Math.sin(wt * 14) * 0.6;
          w.wingR.rotation.z = -Math.sin(wt * 14) * 0.6;
        }
      }

      // Reveal props over time
      for (const p of propMeshes) {
        const reveal = Math.min(1, Math.max(0, (progress - 0.12 - p.userData.index * 0.08) / 0.15));
        const pop = easeOutBack(reveal);
        p.scale.setScalar(pop);
        p.rotation.y = progress * p.userData.spin * Math.PI * 2;
        p.position.y += Math.sin(wt * 2 + p.userData.index) * 0.002;
        p.visible = reveal > 0.01;
      }

      for (const s of sparkles) {
        const pulse = 0.5 + 0.5 * Math.sin(wt * s.speed + s.phase);
        s.mesh.scale.setScalar(0.6 + pulse * 0.8);
        s.mesh.material.opacity = 0.35 + pulse * 0.65;
        s.mesh.material.transparent = true;
        s.mesh.visible = mood === "celebrate" || showMode;
      }

      if (talkingCloseup) {
        camera.position.set(camX * 0.2, camY + bodyY * 0.15, camZ);
        camera.lookAt(0, 1.45 + bodyY * 0.15, 0);
      } else {
        camera.position.set(camX, camY, camZ);
        camera.lookAt(charX * 0.3, 1.4 + bodyY * 0.25, 0);
      }
      renderer.render(scene, camera);
    }

    animateAt(0, 0);
    window.__setFrame = (progress, mouth) => {
      animateAt(Number(progress) || 0, Number(mouth) || 0);
    };
    window.__ready = true;
  </script>
</body>
</html>
